plugins {
    id 'application'
        id 'eclipse'
        id 'java'
        id 'com.github.johnrengelman.shadow' version "7.1.2"
        id 'org.beryx.runtime' version '1.12.7'
        id "com.github.langmo.gradlensis" version "0.1.0"
}

def os = System.getProperty("os.name").toLowerCase()
def arch = System.getProperty("os.arch").toLowerCase()

if (os.contains("windows")) os='windows'
else if (os.contains("linux")) os='linux'
else if (os.contains("mac")) os='mac'
 
repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

java {
        sourceCompatibility = JavaVersion.toVersion("17")
        targetCompatibility = JavaVersion.toVersion("17")
}

dependencies {
    // Use TestNG framework, also requires calling test.useTestNG() below
    testImplementation 'org.testng:testng:7.4.0'

        annotationProcessor group: 'org.projectlombok'                 ,name: 'lombok'                         ,version: '1.18.24'

        implementation 'com.google.guava:guava:31.1-jre'
        implementation 'info.picocli:picocli:4.6.3'
        implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'
        implementation group: 'net.java.dev.jna', name: 'jna-platform', version: '5.12.1'
        implementation group: 'com.igormaznitsa', name: 'jbbp', version: '2.0.4'
        implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.4.0'
        implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.0'

        implementation('org.slf4j:slf4j-api:2.0.0')
        implementation group: 'org.slf4j', name: 'slf4j-ext', version: '2.0.0'

        if (os.contains("mac")) {
                def swtMacArch = (arch == "aarch64" || arch == "arm64") ? "aarch64" : "x86_64"
                implementation "org.eclipse.platform:org.eclipse.swt.cocoa.macosx.${swtMacArch}:3.132.0"
        }
        else {
                implementation group: 'org.eclipse.platform', name: 'org.eclipse.swt', version: '3.132.0'
        }
        implementation group: 'org.eclipse.platform', name: 'org.eclipse.core.runtime', version: '3.25.0'
        implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.21'
        implementation group: 'org.rauschig', name: 'jarchivelib', version: '1.2.0'
        implementation group: 'org.eclipse.platform', name: 'org.eclipse.core.commands', version: '3.10.200'
        implementation group: 'org.eclipse.platform', name: 'org.eclipse.jface', version: '3.26.0'
        implementation group: 'org.eclipse.jgit', name: 'org.eclipse.jgit', version: '6.3.0.202209071007-r'
        implementation group: 'org.eclipse.jgit', name: 'org.eclipse.jgit.archive', version: '6.3.0.202209071007-r'

        implementation group: 'net.dongliu', name: 'apk-parser', version: '2.6.10'
        implementation group: 'org.riversun', name: 'bigdoc', version: '0.3.0'
        implementation group: 'org.lz4', name: 'lz4-java', version: '1.8.0'
        implementation group: 'org.bidib.com.github.markusbernhardt', name: 'proxy-vole', version: '1.0.17'

        implementation group: 'org.bouncycastle', name: 'bcutil-jdk18on', version: '1.71'
        implementation group: 'org.jdom', name: 'jdom2', version: '2.0.6.1'
        implementation 'net.fornwall:jelf:0.7.0'
        implementation group: 'com.turn', name: 'ttorrent-core', version: '1.5'
        implementation group: 'org.apache-extras.beanshell', name: 'bsh', version: '2.0b6'

        compileOnly         group: 'org.projectlombok'                 ,name: 'lombok'                         ,version: '1.18.24'

}

configurations.all {
        resolutionStrategy {
                dependencySubstitution {
                        if (os.contains("windows")) {
                                substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') with module("org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:3.132.0")
                        }
                        else if (os.contains("linux")) {
                                substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') with module("org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:3.132.0")
                        }
                        else if (os.contains("mac")) {
                                def swtMacArch = (arch == "aarch64" || arch == "arm64") ? "aarch64" : "x86_64"
                                substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') with module("org.eclipse.platform:org.eclipse.swt.cocoa.macosx.${swtMacArch}:3.132.0")
                        }
                }
        }
}

nsis {
        // Enter here the configuration settings of the gradle-nsis plugin.
        // Note: a task "createInstaller" is automatically generated.

        // path to the NSIS configuration file
        configuration = file("${projectDir}/nsis/setup.nsi")

        variables = ['VERSION':"${flashtoolVersion}"]
        // folder where the NSIS installer generator is run. All paths
        // in the NSIS configuration file are relative to this folder.
        runIn =  file("${projectDir}/build/install/Flashtool")
}

distributions {
    main {
        contents {
            from ('src/main/resources/native/'+os) { 
                if (os.contains("linux") || os.contains("mac")) {
					fileMode 0755
				}
			}
			if (os.contains("mac")) {
               from ('src/main/resources/custom') {
                   into 'FlashTool.app/Contents/MacOS/custom'
                   // Community core: do not bundle legacy rooting payloads.
                   exclude 'root/**'
               }
 			   from(jre) { into 'FlashTool.app/Contents/MacOS/jre' }
			} else {
               from ('src/main/resources/custom') { into 'custom' }
 			   from(jre) { into 'jre' }
 			}
            if (os.contains("windows")) {
                from (project(':FlashtoolDrivers').buildDir.toString()+'/distributions') { into 'drivers' }
            }
        }
    }
}

[distZip, distTar, installDist, createInstaller]*.dependsOn(':FlashtoolDrivers:createInstaller')

[createInstaller]*.dependsOn('installDist')

apply from: 'gradle/mac-arm64-native.gradle'

installDist.doLast() {
        if (os.contains("mac")) {
           def dist = "${buildDir}/install/${project.name}"
           if (arch in ['arm64', 'aarch64']) {
               project.ext.stagePinnedMacArm64Native.call(file("$dist/FlashTool.app/Contents/MacOS/x10flasher_native"))
           }
           // Stop if legacy rooting resources entered the assembled application.
           def packagedRoot = file("$dist/FlashTool.app/Contents/MacOS/custom/root")
           if (packagedRoot.exists()) {
               throw new GradleException("Community build contains excluded rooting payloads: $packagedRoot")
           }
           ant.move(file: "$dist/lib", toFile: "$dist/FlashTool.app/Contents/MacOS/lib")
           def udevDir = file("$dist/FlashTool.app/Contents/MacOS/x10flasher_native/udev")
           def libusbFile = new File(udevDir, "libusbx-1.0.0.dylib")
           def libusbLink = new File(udevDir, "libusbx-1.0.dylib")

           if (!libusbFile.isFile()) {
               throw new GradleException("Bundled libusb not found: $libusbFile")
           }

           // Create a relative symbolic link so the application is relocatable.
           java.nio.file.Files.deleteIfExists(libusbLink.toPath())
           java.nio.file.Files.createSymbolicLink(
               libusbLink.toPath(),
               java.nio.file.Paths.get("libusbx-1.0.0.dylib")
           )

           // Give the bundled library a relocatable install name.
           exec {
               commandLine "install_name_tool",
                   "-id",
                   "@loader_path/libusbx-1.0.0.dylib",
                   libusbFile.absolutePath
           }

           // Re-sign the modified ARM64 library for local testing.
           // A public release will require proper application signing.
           exec {
               commandLine "codesign",
                   "--force",
                   "--sign",
                   "-",
                   "--timestamp=none",
                   libusbFile.absolutePath
           }
        }
}


// Compile native Apple Silicon launcher after assembling the application.
installDist.doLast {
    if (os.contains("mac") && arch in ["aarch64", "arm64"]) {

        println "Compile native Apple Silicon launcher"

        def sourceFile = file(
            "src/main/native/mac/FlashToolLauncher.m"
        )

        def executable = file(
            "$buildDir/install/${project.name}/FlashTool.app/Contents/MacOS/FlashTool"
        )

        if (!sourceFile.isFile()) {
            throw new GradleException(
                "Native launcher source not found: $sourceFile"
            )
        }

        project.exec {
            commandLine "xcrun", "clang",
                "-arch", "arm64",
                "-mmacosx-version-min=11.0",
                "-fobjc-arc",
                "-framework", "Foundation",
                sourceFile.absolutePath,
                "-o", executable.absolutePath
        }

        println "Native launcher created: $executable"
    }
}


// Package and ad-hoc sign Apple Silicon application.
// Runs after the existing installDist actions have assembled the
// application and compiled its native launcher.
installDist.doLast {
    if (os.contains("mac") && arch in ["aarch64", "arm64"]) {

        def appDir = file(
            "$buildDir/install/${project.name}/FlashTool.app"
        )

        def contents = new File(appDir, "Contents")
        def macDir = new File(contents, "MacOS")
        def dataDir = new File(contents, "Resources/Flashtool")
        def javaHome = new File(contents, "runtime/Contents/Home")

        println "Preparing standalone Apple Silicon application..."

        // Reproduce the application layout validated manually.
        def relocations = [
            [
                source: new File(macDir, "jre"),
                target: javaHome
            ],
            [
                source: new File(macDir, "lib"),
                target: new File(dataDir, "lib")
            ],
            [
                source: new File(macDir, "custom"),
                target: new File(dataDir, "custom")
            ],
            [
                source: new File(macDir, "x10flasher_native"),
                target: new File(dataDir, "x10flasher_native")
            ]
        ]

        // Validate everything before moving any directories.
        relocations.each { entry ->
            if (!entry.source.isDirectory()) {
                throw new GradleException(
                    "Missing application directory: ${entry.source}"
                )
            }

            if (entry.target.exists()) {
                throw new GradleException(
                    "Destination already exists: ${entry.target}"
                )
            }
        }

        relocations.each { entry ->
            entry.target.parentFile.mkdirs()

            java.nio.file.Files.move(
                entry.source.toPath(),
                entry.target.toPath()
            )
        }

        def launcher = new File(macDir, "FlashTool")
        def javaExecutable = new File(javaHome, "bin/java")

        if (!launcher.isFile() || !javaExecutable.isFile()) {
            throw new GradleException(
                "Native launcher or bundled Java is missing"
            )
        }

        // Confirm that the libusb link remains relocatable.
        def libusbLink = new File(
            dataDir,
            "x10flasher_native/udev/libusbx-1.0.dylib"
        )

        if (!java.nio.file.Files.isSymbolicLink(
                libusbLink.toPath())) {
            throw new GradleException(
                "Bundled libusb symbolic link is missing"
            )
        }

        def linkTarget = java.nio.file.Files.readSymbolicLink(
            libusbLink.toPath()
        ).toString()

        if (linkTarget != "libusbx-1.0.0.dylib") {
            throw new GradleException(
                "Bundled libusb link is not relative: $linkTarget"
            )
        }

        // Remove problematic metadata from the assembled copy only.
        project.exec {
            commandLine "xattr", "-cr", appDir.absolutePath
        }

        println "Signing embedded native components..."

        int signed = 0

        fileTree(appDir).files.sort {
            it.absolutePath
        }.each { nativeFile ->

            if (nativeFile.isFile() &&
                !java.nio.file.Files.isSymbolicLink(
                    nativeFile.toPath()) &&
                nativeFile.absolutePath != launcher.absolutePath) {

                def fileInfo = new java.io.ByteArrayOutputStream()

                project.exec {
                    commandLine "file", "-b",
                        nativeFile.absolutePath
                    standardOutput = fileInfo
                }

                if (fileInfo.toString("UTF-8").contains("Mach-O")) {
                    project.exec {
                        commandLine "codesign",
                            "--force",
                            "--sign", "-",
                            "--timestamp=none",
                            nativeFile.absolutePath
                    }

                    signed++
                }
            }
        }

        if (signed == 0) {
            throw new GradleException(
                "No embedded native components were signed"
            )
        }

        println "Signed $signed embedded native components."

        // Sign the complete bundle, including its main launcher.
        println "Signing FlashTool.app..."

        project.exec {
            commandLine "codesign",
                "--force",
                "--sign", "-",
                "--timestamp=none",
                appDir.absolutePath
        }

        // Fail the build if the signature is invalid.
        project.exec {
            commandLine "codesign",
                "--verify",
                "--deep",
                "--strict",
                "--verbose=2",
                appDir.absolutePath
        }

        println "Apple Silicon application signing verified."
    }
}

task createDMG() {
    group = 'distribution'
    description = 'Creates a standalone Apple Silicon DMG'

    doLast {
        if (!os.contains("mac") ||
                !(arch in ["aarch64", "arm64"])) {
            throw new GradleException(
                "Apple Silicon DMG requires an ARM64 Mac")
        }

        def appDir = file(
            "$buildDir/install/${project.name}/FlashTool.app"
        )

        if (!appDir.isDirectory()) {
            throw new GradleException(
                "Application bundle not found: $appDir")
        }

        def stagingDir = file("$buildDir/dmg-staging")
        def stagedApp = new File(stagingDir, "FlashTool.app")
        def applicationsLink = new File(stagingDir, "Applications")

        def outputDir = file("$buildDir/distributions")
        outputDir.mkdirs()

        def outputFile = new File(
            outputDir,
            "Flashtool-${flashtoolVersion}-mac-arm64-community-rc1.dmg"
        )

        delete stagingDir
        stagingDir.mkdirs()

        try {
            // Preserve executable permissions and symbolic links.
            project.exec {
                commandLine 'ditto',
                    appDir.absolutePath,
                    stagedApp.absolutePath
            }

            // Standard macOS drag-and-drop installation shortcut.
            java.nio.file.Files.createSymbolicLink(
                applicationsLink.toPath(),
                java.nio.file.Paths.get("/Applications")
            )

            println "Creating Apple Silicon DMG..."

            project.exec {
                commandLine 'hdiutil',
                    'create',
                    '-fs', 'HFS+',
                    '-volname', 'FlashTool',
                    '-srcfolder', stagingDir.absolutePath,
                    '-format', 'UDZO',
                    '-ov',
                    outputFile.absolutePath
            }

            if (!outputFile.isFile()) {
                throw new GradleException(
                    "DMG creation did not produce an output file")
            }

            println "DMG created: $outputFile"

        } finally {
            delete stagingDir
        }
    }
}

createDMG.dependsOn('installDist')

distTar.doLast() {
        def dist = "${buildDir}/distributions/"
        ant.bzip2(src: "${dist}/Flashtool.tar", destfile: "${dist}/${project.name}-${flashtoolVersion}-${os}.tar.bz2")
        delete "${dist}/Flashtool.tar"
}

jar {
        processResources {
                exclude("native/**")
                exclude("custom/**")
                exclude("launch4j/**")
        }
        manifest {
                attributes('Implementation-Title'   : 'Flashtool',
                               'Implementation-Date'    : "${flashtoolReleaseDate}",
                                   'Implementation-Version' : "${flashtoolVersion}",
                                   'Internal-Version'       : "${flashtoolVersion}",
                                   'Internal-Date'          : "${flashtoolReleaseDate}",
                                   'Internal-Channel'       : 'release'
                                   )
        }
}

application {
    // Define the main class for the application.
    mainClass = 'org.flashtool.gui.Main'
        applicationDefaultJvmArgs = ['-Dlog4j2.Script.enableLanguages=bsh','-Xms256m','-Xmx1024m','-Duser.country=US','-Duser.language=en','-Djsse.enableSNIExtension=false']
        startScripts.enabled = false
}


runtime {
    // Pin Apple Silicon jlink JDK.
    if (os == 'mac' && arch in ['aarch64', 'arm64']) {
        javaHome = new File(
            System.getProperty('user.home'),
            '.cache/flashtool/temurin-17.0.20.1+1/extracted/jdk-17.0.20.1+1/Contents/Home'
        ).absolutePath
    }
        options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
        modules = ['java.base','java.compiler','java.datatransfer','java.desktop','java.instrument','java.logging','java.management','java.naming','java.prefs','java.rmi','java.scripting','java.security.jgss','java.security.sasl','java.sql','java.transaction.xa','java.xml','jdk.attach','jdk.jdi','jdk.unsupported','jdk.xml.dom','jdk.security.auth','jdk.security.jgss','jdk.crypto.cryptoki','jdk.crypto.ec','jdk.management']
        imageDir = file("$buildDir/image/jre")
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use TestNG test framework
            useTestNG('7.4.0')
        }
    }
}


// Clean previous assembled Apple Silicon installation.
// The packaging task relocates files after installDist, so
// Gradle cannot reuse the previous installation directory.
// This does not affect source files or generated DMGs.
installDist.doFirst {
    if (os == 'mac' && arch in ['aarch64', 'arm64']) {
        def previousInstall = file("$buildDir/install/${project.name}")
        if (previousInstall.exists()) {
            logger.lifecycle("Removing previous assembled installation")
            project.delete(previousInstall)
        }
    }
}


// Lock resolved dependency versions for repeatable builds.
dependencyLocking {
    lockAllConfigurations()
}
